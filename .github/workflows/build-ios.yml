    - name: Build IPA (Ad-Hoc / No Code Sign)
      run: |
        cd ios/App
        
        # Build for iOS device (iphoneos)
        xcodebuild -workspace App.xcworkspace \
          -scheme App \
          -configuration Release \
          -derivedDataPath build \
          -arch arm64 \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          build
        
        # Find the actual .app location
        APP_PATH=$(find build -name "App.app" -type d | head -1)
        
        if [ -z "$APP_PATH" ]; then
          echo "Error: App.app not found"
          find build -name "*.app" -type d
          exit 1
        fi
        
        echo "Found app at: $APP_PATH"
        
        # Create IPA structure
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/App.app
        zip -r MusicPlayer.ipa Payload
        
        # Verify
        if [ -f "MusicPlayer.ipa" ]; then
          echo "✓ IPA created successfully"
          ls -lh MusicPlayer.ipa
        else
          echo "Error: IPA not created"
          exit 1
        fi
